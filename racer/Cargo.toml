[package]
name = "symbolic-racer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.dnacalc]
portability = "native-only"

[dependencies]
calc-func = { path = "../../DnaCalc/crates/calc-func" }
calc-verdict = { path = "../../DnaCalc/tools/calc-verdict" }
libm = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
serde_json = "1"

[features]
soft-x87 = ["calc-func/soft-x87"]
